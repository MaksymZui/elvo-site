# Inside the elvo-web container. TLS ends at Product Hub's nginx, which proxies here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    # Requests arrive through the shared nginx: without `any` they could stay uncompressed
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # add_header in a location cancels the ones above it, so both locations include the snippet
    location /_astro/ {
        include snippets/elvo-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        include snippets/elvo-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
