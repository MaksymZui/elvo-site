# ELVO, startup mode (no certificate for ${ELVO_DOMAIN} yet): certbot checks only.
# Goes into Product Hub as deploy/nginx/templates/elvo-http.conf.template, see docs/DEPLOY.md.
server {
    listen 80;
    server_name ${ELVO_DOMAIN} www.${ELVO_DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 503;
    }
}
