# ELVO: HTTPS for ${ELVO_DOMAIN} → container elvo-web:80 (separate compose, external network edge).
# Goes into Product Hub as deploy/nginx/templates/elvo-https.conf.template, see docs/DEPLOY.md.
# common.conf (http context) is already included from default.conf: do not include it twice.

# HTTP: certbot checks only, everything else goes to https
server {
    listen 80;
    server_name ${ELVO_DOMAIN} www.${ELVO_DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://${ELVO_DOMAIN}$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl;
    http2 on;
    server_name www.${ELVO_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${ELVO_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${ELVO_DOMAIN}/privkey.pem;
    include snippets/ssl.conf;

    return 301 https://${ELVO_DOMAIN}$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${ELVO_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${ELVO_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${ELVO_DOMAIN}/privkey.pem;
    include snippets/ssl.conf;

    # Resolved per request (Docker DNS): nginx starts and serves other sites even when elvo-web is down
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $elvo http://elvo-web:80;

    location / {
        proxy_pass $elvo;
        # HTTP/1.0 would make the inner nginx skip gzip
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
